plugins {
    id 'java'
    id 'application'
}

group = 'ru.celestial'
version = 'Beta-1.16.5'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// src/main/java/celestial/** is a reference copy of the client's decompiled
// classes (the game loads celestial.* from the runtime jar, not from this
// source tree). It is not part of the build: keep it on disk for reading, but
// do not feed it to javac, which chokes on decompiler artefacts.
sourceSets {
    main {
        java {
            exclude 'celestial/**'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-nowarn', '-Xlint:none', '-Xmaxerrs', '10000']
}

repositories {
    mavenCentral()
}

configurations {
    remapWorker
}

dependencies {
    // Minecraft client classes are kept separately; all external runtime libraries
    // are resolved from the supplied libraries/ directory.
    implementation files('libs/celestial-client-remapped.jar')
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    remapWorker 'org.ow2.asm:asm:9.7.1'
    remapWorker 'org.ow2.asm:asm-commons:9.7.1'
}

// The loader receives one client jar. Embed the remapped Minecraft classes so
// net.minecraft.client.main.Main is available at runtime.
tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        zipTree(file('libs/celestial-client-remapped.jar')).matching {
            exclude('net/minecraft/client/main/Main.class')
        }
    }
}

